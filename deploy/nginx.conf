# Reverse proxy + TLS termination for the Momentum API container.
# Install to /etc/nginx/sites-available/momentum and symlink into
# sites-enabled. Replace `server_name` with your domain once you have one;
# `_` matches any Host header, which is what you want for bare-IP access.

server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/momentum.crt;
    ssl_certificate_key /etc/nginx/ssl/momentum.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 15m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
